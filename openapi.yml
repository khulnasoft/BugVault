          - KERNELSEC
          - LKML
          - LWN
          - MACROMEDIA
          - MAGEIA
          - MAILINGLIST
          - MILW0RM
          - MIT
          - MITRE
          - MOZILLA
          - MUTTDEV
          - NETDEV
          - NISCC
          - NVD
          - OCERT
          - OPENOFFICE
          - OPENSSL
          - OPENSUSE
          - ORACLE
          - OSS
          - OSSSECURITY
          - OSV
          - PHP
