          - POSTGRESQL
          - PRESS
          - REAL
          - REDHAT
          - RESEARCHER
          - RT
          - SAMBA
          - SECALERT
          - SECUNIA
          - SECURITYFOCUS
          - SKO
          - SQUID
          - SQUIRRELMAIL
          - SUN
          - SUNSOLVE
          - SUSE
          - TWITTER
          - UBUNTU
          - UPSTREAM
          - VENDORSEC
          - VULNWATCH
          - WIRESHARK
          - XCHAT
          - XEN
          - XPDF
      - in: query
        name: flaw__unembargo_dt
        schema:
          type: string
          format: date-time
      - in: query
        name: flaw__updated_dt
        schema:
          type: string
          format: date-time
      - in: query
        name: flaw__updated_dt__date
        schema:
          type: string
          format: date
      - in: query
        name: flaw__updated_dt__date__gte
        schema:
          type: string
          format: date
      - in: query
        name: flaw__updated_dt__date__lte
